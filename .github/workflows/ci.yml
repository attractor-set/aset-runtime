name: ci
on:
  push:
  pull_request:

jobs:
  local-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q reference tools tests
      - run: python tools/run_local_gate.py
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q

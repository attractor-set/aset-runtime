name: ASET Worker Alpha4 verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout pinned ASET Seed Alpha4
        uses: actions/checkout@v7
        with:
          repository: attractor-set/aset-seed
          ref: 08bc0c4dfb5c158fe4641c93a87c7c5914cb2d2c
          path: .upstream/aset-seed
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements-ci.txt

      - name: Download pinned TLAPM
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz"
          unpack="$RUNNER_TEMP/tlapm-unpacked"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz
          echo "bfa5e5350ac1ec7202feecad0a4a71a5bb58c16a49660448b35b6f371ba9e2f5  $archive" | sha256sum --check
          mkdir -p "$unpack"
          tar -xzf "$archive" -C "$unpack"
          tlapm_bin="$(find "$unpack" -type f -path '*/bin/tlapm' -print -quit)"
          test -n "$tlapm_bin"
          test -x "$tlapm_bin"
          test "$("$tlapm_bin" --version)" = "4600b24"
          echo "TLAPM_BIN=$tlapm_bin" >> "$GITHUB_ENV"

      - name: Verify Alpha4 semantic inheritance
        run: python -m tools.alpha4_worker_gate --seed-root .upstream/aset-seed

      - run: python -m pytest -q

      - name: Prove Worker Alpha4
        run: >-
          python -m tools.run_alpha4_worker_tlaps
          --seed-root .upstream/aset-seed

      - run: python -m ruff format --check .
      - run: python -m ruff check .

      - name: Build deterministic Worker repository snapshot
        run: python -m tools.build_snapshot --verify-determinism

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aset-worker-alpha4-evidence
          if-no-files-found: warn
          path: dist/**

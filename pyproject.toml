[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aset-worker-extension"
version = "0.1.0a4"
description = "ASET Worker Alpha4 productive-attempt semantic extension"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
